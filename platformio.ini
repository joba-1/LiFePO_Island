; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Environments (see docs/spec.md, docs/admin.md):
;   mhetesp32minikit_ota/_ser  the island (instance 1)
;   esp32cam_ota/_ser          alternative board
;   atom_echo                  test bench: M5Stack Atom Echo, instance 9, simulated devices
;   native                     unit tests: pio test -e native

[platformio]
;default_envs = d1_mini_ser
default_envs = esp32cam_ota
;default_envs = esp32cam_ser

[program]
name = LiFePO_Island
version = 4.5.2

[influx]
; service aliases; only the defaults - runtime: POST /api/netconfig
server = influx
port = 8086
database = ${program.name}

[ntp]
server = fritz.box
; POSIX TZ rule: CET/CEST with the EU switch dates
timezone = CET-1CEST,M3.5.0,M10.5.0/3

[syslog]
server = syslog
port = 514

[mqtt]
server = mqtt
port = 1883
topic = ${program.name}

[ota]
; the island is only reachable through the nat2 range extender's port forward
host = nat2:8080
scripts =
    pre:pio_secrets.py
    pre:embed_web.py
    pre:git_version.py
    upload_script.py

[env]
framework = arduino
extra_scripts =
    pre:pio_secrets.py
    pre:embed_web.py
    pre:git_version.py
monitor_speed = 115200
board_build.f_cpu = 80000000L
board_build.partitions = min_spiffs.csv
lib_ignore = examples
lib_deps =
    Syslog
    https://github.com/tzapu/WiFiManager.git#fe9774fe0f231767f3fc59de1a03a9c44f06adc3
    NTPClient
    PubSubClient
    Joba_ESmart3
    # https://github.com/joba-1/Joba_ESmart3.git#fix-esmart3s-view-on-32bit
    Joba_JbdBms
; per environment: instance number (host name, MQTT topic), InfluxDB database, extra flags
custom_instance = 1
custom_influx_db = ${influx.database}
custom_ha_prefix = homeassistant
; names of the BMS temperature probes, in BMS order (page and Home Assistant)
custom_ntc_names = BMS board,Battery box
custom_flags =
build_flags =
    -Wall
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
    -DVERSION='"${program.version}"'
    -DPROGNAME='"${program.name}"'
    -DHOSTNAME='"${program.name}-${this.custom_instance}"'
    -DBAUDRATE=${env.monitor_speed}
    -DINFLUX_SERVER='"${influx.server}"'
    -DINFLUX_PORT=${influx.port}
    -DINFLUX_DB='"${this.custom_influx_db}"'
    -DSYSLOG_SERVER='"${syslog.server}"'
    -DSYSLOG_PORT=${syslog.port}
    -DMQTT_SERVER='"${mqtt.server}"'
    -DMQTT_TOPIC='"${mqtt.topic}/${this.custom_instance}"'
    -DMQTT_PORT=${mqtt.port}
    -DMQTT_MAX_PACKET_SIZE=512
    -DNTP_SERVER='"${ntp.server}"'
    -DTIMEZONE='"${ntp.timezone}"'
    -DHA_DISCOVERY_PREFIX='"${this.custom_ha_prefix}"'
    -DNTC_NAMES='"${this.custom_ntc_names}"'
    ${this.custom_flags}

[env:mhetesp32minikit_ser]
platform = espressif32
board = mhetesp32minikit
monitor_port = /dev/ttyUSB3
monitor_filters = esp32_exception_decoder
upload_port = /dev/ttyUSB3

[env:mhetesp32minikit_ota]
platform = espressif32
board = mhetesp32minikit
monitor_port = /dev/ttyACM0
monitor_filters = esp32_exception_decoder
extra_scripts = ${ota.scripts}
upload_protocol = custom
upload_port = ${ota.host}/update

[env:esp32cam_ser]
platform = espressif32
board = esp32cam
monitor_port = /dev/ttyUSB3
monitor_filters = esp32_exception_decoder
upload_port = /dev/ttyUSB3

[env:esp32cam_ota]
platform = espressif32
board = esp32cam
monitor_port = /dev/ttyUSB3
monitor_filters = esp32_exception_decoder
extra_scripts = ${ota.scripts}
upload_protocol = custom
upload_port = ${ota.host}/update

; Test bench: M5Stack Atom Echo (ESP32-PICO-D4), no RS485 hardware.
; SIMULATE replaces charger and BMS by src/sim/SimDevices.h. The Echo's LED is
; an SK6812 (no PWM) and GPIO 33 drives its speaker: both LEDs off; the
; button is G39 (no internal pull-up needed, it has an external one).
; Own instance and database: never mixes with the island's data.
[env:atom_echo]
platform = espressif32
board = m5stack-atom
custom_instance = 9
custom_influx_db = ${program.name}_test
custom_bench_wifi = yes
; HA ignores this prefix: discovery is checked on the bench without creating entities
custom_ha_prefix = homeassistant_bench
custom_flags =
    -DSIMULATE
    -DHEALTH_LED_PIN=-1
    -DLOAD_LED_PIN=-1
    -DLOAD_BUTTON_PIN=39
monitor_port = /dev/serial/by-id/usb-Hades2001_M5stack_71527E0C75-if00-port0
monitor_filters = esp32_exception_decoder
upload_port = /dev/serial/by-id/usb-Hades2001_M5stack_71527E0C75-if00-port0
upload_speed = 750000

; Unit tests of the header-only logic in include/ (no Arduino, runs on the host)
[env:native]
platform = native
framework =
extra_scripts =
lib_deps =
build_flags = -std=gnu++17 -Wall -Wextra
test_framework = unity

[env:d1_mini_ser]
platform = espressif8266
board = d1_mini
monitor_port = /dev/ttyUSB2
monitor_filters = esp8266_exception_decoder
upload_speed = 460800
upload_port = /dev/ttyUSB2

[env:d1_mini_ota]
platform = espressif8266
board = d1_mini
monitor_port = /dev/ttyUSB2
monitor_filters = esp8266_exception_decoder
extra_scripts = ${ota.scripts}
upload_protocol = custom
upload_port = ${ota.host}/update
